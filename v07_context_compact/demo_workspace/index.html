<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐍 贪吃蛇</h1>
        <div class="score-board">
            <div class="score-item">
                <span class="label">当前分数</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">最高纪录</span>
                <span id="highScore" class="value">0</span>
            </div>
        </div>
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <h2 id="overlayTitle">贪吃蛇</h2>
                    <p id="overlayMessage">使用方向键控制蛇的移动</p>
                    <p id="finalScore" class="final-score"></p>
                    <button id="startBtn">开始游戏</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <p>使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 方向键控制</p>
            <p>按 <kbd>空格</kbd> 暂停 / 继续</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
